
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify files
        shell: cmd
        run: dir

      - name: Run Build BAT
        shell: cmd
        run: Build_EXE_Windows11_Python313_Nuitka_NO_EXCEL_FINAL.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LogMergeTool_NoExcel
          path: dist/LogMergeTool_NoExcel.exe
