
name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
        shell: powershell

      - name: Run BAT
        run: build.bat
        shell: cmd

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Complaint_Service_Hub
          path: Complaint_Service_Hub_Distribution.zip
